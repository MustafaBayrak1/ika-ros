# Robot geometrisi için TEK kaynak.
#
# Hem URDF (urdf/ika.urdf.xacro) hem de ika_base_node (kinematik/odometri)
# bu dosyayı okur; teker ölçüsünü yalnızca burada değiştirin.
#
# base_link: iki tahrik tekerinin aks ortası (zeminden wheel_radius kadar
# yukarıda). x ileri, y sol, z yukarı. Birimler: metre / radyan.
#
# DİKKAT: Değerler yer tutucudur, yeni şasi üzerinde ölçülmeli.

wheel_radius: 0.04163      # ETKİN yuvarlanma yarıçapı: lastik yük altında ezildiği için
                           # geometrik değerden (85 mm teker, r = 0.0425) küçüktür. 2026-11-20,
                           # pil robotun altında: yerde 3 × 2 m düz sürüş, şerit metre /
                           # odometri = 0.9795 (±%0.5). Pil yeri, teker ya da zemin değişirse
                           # 1–2 m düz sürüş testiyle yeniden ölçün (docs/saha-testi.md, 6).
wheel_separation: 0.1953   # ETKİN teker arası: 2026-11-20 yerinde 5 tur, jiroskopla karşılaştırma
                           # (teker odometrisi eski 0.17 ile %17.5 fazla dönüş sayıyordu). Yerinde
                           # dönerken lastikler kaydığı için cetvelle ölçülenden büyük olabilir.
wheel_width: 0.038

chassis:                   # lidar freni de bu ölçüleri kullanır (gövde ayak izi)
  length: 0.19
  width: 0.23
  height: 0.07
  x: 0.025                 # 2026-11-09: aks önden ~12 cm geride (çizgi sensörü dahil)
  z: 0.02

caster:
  radius: 0.015
  x: 0.11

# Sensör montaj konumları (base_link'e göre).
imu:                       # Gemstone kartı üzerindeki ICM-20948
  x: 0.0
  y: 0.0
  z: 0.04
  # Kitte IMU ters yönde: robot sola dönerken /imu/data_raw z negatifti
  # (2026-10-28, teker +1.07, IMU -0.93 rad/s). Doğrulama: saha-testi.md 1. adım.
  roll: 3.14159
  pitch: 0.0
  yaw: 0.0
lidar:                     # RPLIDAR A1 dönen kafanın merkezi
  x: 0.01
  y: 0.0
  z: 0.12
  # Lidar 0° okunun base_link x eksenine açısı. Kitte lidar 180° dönük
  # takılı (2026-10-28, robotun önüne konan kutu /scan'de -179° göründü).
  # Yeniden ölçmek: docs/saha-testi.md, 7. adım.
  yaw: 3.124
line_sensor:               # çizgi sensörü dizisinin merkezi
  x: 0.12
  y: 0.0
  z: -0.025
